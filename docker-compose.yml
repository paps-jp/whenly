services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-whenly}
      MARIADB_USER: ${DB_USER:-whenly}
      MARIADB_PASSWORD: ${DB_PASSWORD:-whenlypassword}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-grants.sql:/docker-entrypoint-initdb.d/init-grants.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://${DB_USER:-whenly}:${DB_PASSWORD:-whenlypassword}@db:3306/${DB_NAME:-whenly}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-this-to-a-random-32-char-secret}
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  db_data:
